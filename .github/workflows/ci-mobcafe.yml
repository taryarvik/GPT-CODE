name: Build MobCafe 2 Java25
on:
  push:
    branches: [mobcafe-2-java25-ci]
    paths:
      - 'ci/mobcafe-src.part*'
      - '.github/workflows/ci-mobcafe.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Extract project
        run: |
          cat ci/mobcafe-src.part* | base64 --decode > /tmp/mobcafe-src.tar.xz
          sha256sum /tmp/mobcafe-src.tar.xz
          tar -xJf /tmp/mobcafe-src.tar.xz
          python ci/patch-26_3.py
      - name: Build and test
        run: |
          cd MobCafe-2.0-NeoForge-WIP
          gradle clean assemble runCoreSelfTest --stacktrace
      - name: Upload logs and JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobcafe-build
          path: |
            MobCafe-2.0-NeoForge-WIP/build/libs/*.jar
            MobCafe-2.0-NeoForge-WIP/build/reports/
          if-no-files-found: warn
